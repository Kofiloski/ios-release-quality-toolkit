name: Release tagged version

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Validate toolkit
        run: python scripts/check-toolkit.py

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Validate release version
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          plugin_version="$(python -c 'import json; print(json.load(open("plugins/ios-release-quality-toolkit/.codex-plugin/plugin.json"))["version"])')"
          if [[ "${RELEASE_TAG}" != "v${plugin_version}" ]]; then
            echo "Release tag ${RELEASE_TAG} does not match plugin version ${plugin_version}." >&2
            exit 1
          fi

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "GitHub release ${RELEASE_TAG} already exists."
          else
            gh release create "${RELEASE_TAG}" \
              --verify-tag \
              --title "${RELEASE_TAG}" \
              --generate-notes
          fi
