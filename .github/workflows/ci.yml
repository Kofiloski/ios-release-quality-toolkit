name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate toolkit contract
        run: python scripts/check-toolkit.py
      - name: Run tests
        run: python -m unittest discover -s tests -v
